name: Daily market data
# every weekday evening after the GPW session (17:45 UTC = 18:45 Warsaw in winter, 19:45 in summer)
on:
  schedule:
    - cron: '45 17 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch GPW, GUS, NBP and the bond offer
        run: npx tsx scripts/fetch-data.ts --out public/data
      - name: Commit the new data
        run: |
          git config user.name "kapital-data"
          git config user.email "kapital-data@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)" && git push
  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
